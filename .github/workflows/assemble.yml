name: Bootstrap repository

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  assemble:
    if: ${{ !contains(github.event.head_commit.message, '[bootstrap-complete]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Assemble plugin
        shell: bash
        run: |
          set -euo pipefail

          cat .bootstrap/part* | base64 -d > /tmp/local_coursetranslate.zip
          rm -rf /tmp/local_coursetranslate
          mkdir -p /tmp/local_coursetranslate
          unzip -q /tmp/local_coursetranslate.zip -d /tmp/local_coursetranslate

          rm -rf /tmp/local_coursetranslate/local_coursetranslate/.github
          cp -a /tmp/local_coursetranslate/local_coursetranslate/. .

          curl -fsSL https://raw.githubusercontent.com/EduardoKrausME/moodle-local_ai_bridge/master/LICENSE -o LICENSE

          rm -rf .bootstrap

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add local_coursetranslate [bootstrap-complete]"
          git push origin master
